name: petcare-local

services:
  postgres:
    container_name: petcare-local-postgres
    ports:
      - "127.0.0.1:${EXPOSE_DB_PORT:-55432}:5432"

  redis:
    container_name: petcare-local-redis
    ports:
      - "127.0.0.1:${EXPOSE_REDIS_PORT:-56379}:6379"

  migrate:
    image: ${IMAGE_REGISTRY:-petcare}/server:${SERVER_IMAGE_TAG:-local}
    pull_policy: never
    container_name: petcare-local-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "--filter", "@petcare/server", "prisma:migrate:deploy"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-petcare}
      DB_SCHEMA: ${DB_SCHEMA:-public}
    networks:
      - petcare-network

  server:
    container_name: petcare-local-server
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SMS_DEV_CODE: ${SMS_DEV_CODE:-246810}
    ports:
      - "127.0.0.1:${EXPOSE_SERVER_PORT:-3300}:3000"

  admin:
    container_name: petcare-local-admin
    ports:
      - "127.0.0.1:${EXPOSE_ADMIN_PORT:-8986}:80"

  website:
    container_name: petcare-local-website

  website-gateway:
    container_name: petcare-local-website-gateway

  # 本地监测默认走 Admin 和 Website 的回环端口，不启动需要真实证书的生产 TLS 边缘网关。
  edge-gateway:
    container_name: petcare-local-edge-gateway
    profiles: ["production-tls"]

volumes:
  postgres-data:
    name: petcare-local-postgres-data
  redis-data:
    name: petcare-local-redis-data

networks:
  petcare-network:
    name: petcare-local-network
