services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: petcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-petcare}
      POSTGRES_USER: ${DB_USERNAME:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${EXPOSE_DB_PORT:-}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-user} -d ${DB_NAME:-petcare}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - petcare-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: petcare-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "${EXPOSE_REDIS_PORT:-}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - petcare-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # 后端服务
  # 镜像名：本地构建默认 petcare/server:local；GitHub Actions 部署时通过
  # IMAGE_REGISTRY / IMAGE_TAG 环境变量指向 ghcr.io 镜像（见 .github/workflows/deploy.yml）
  server:
    image: ${IMAGE_REGISTRY:-petcare}/server:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: petcare-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 数据库配置（使用Docker内部网络）
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-petcare}
      DB_SCHEMA: public
      # Redis配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # 异步任务配置；未来独立 Worker 与 API 必须使用相同值
      QUEUE_PREFIX: ${QUEUE_PREFIX:-petcare}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
      ORDER_TIMEOUT_DELAY_MS: ${ORDER_TIMEOUT_DELAY_MS:-172800000}
      # JWT配置
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
      # 管理员初始化与本地短信模拟
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PHONE: ${DEFAULT_ADMIN_PHONE:?DEFAULT_ADMIN_PHONE is required}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?DEFAULT_ADMIN_PASSWORD is required}
      SMS_DEV_CODE: ""
      ALIYUN_SMS_ACCESS_KEY_ID: ${ALIYUN_SMS_ACCESS_KEY_ID:-}
      ALIYUN_SMS_ACCESS_KEY_SECRET: ${ALIYUN_SMS_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
      SMS_CODE_TTL_SECONDS: ${SMS_CODE_TTL_SECONDS:-300}
      SMS_SEND_COOLDOWN_SECONDS: ${SMS_SEND_COOLDOWN_SECONDS:-60}
      SMS_HOURLY_LIMIT: ${SMS_HOURLY_LIMIT:-5}
      SMS_MAX_ATTEMPTS: ${SMS_MAX_ATTEMPTS:-5}
      CAPTCHA_TTL_SECONDS: ${CAPTCHA_TTL_SECONDS:-300}
      CAPTCHA_MAX_ATTEMPTS: ${CAPTCHA_MAX_ATTEMPTS:-5}
      # 服务器配置
      PORT: 3000
      NODE_ENV: production
      # 日志配置；生产环境即使设置 debug 也不会记录原始请求正文
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: /app/logs
      # API配置
      API_BASE_URL: http://localhost:8986/api
      # Docker 管理端与本地 Vite 开发服务器的跨域来源
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8986,http://127.0.0.1:8986}
      # 微信小程序配置
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      TENCENT_COS_SECRET_ID: ${TENCENT_COS_SECRET_ID:-}
      TENCENT_COS_SECRET_KEY: ${TENCENT_COS_SECRET_KEY:-}
      TENCENT_COS_BUCKET: ${TENCENT_COS_BUCKET:-}
      TENCENT_COS_REGION: ${TENCENT_COS_REGION:-}
      TENCENT_COS_PUBLIC_BASE_URL: ${TENCENT_COS_PUBLIC_BASE_URL:-}
      WEBSITE_PUBLIC_URL: ${WEBSITE_PUBLIC_URL:-http://localhost:8080}
      WEBSITE_PREVIEW_TTL_SECONDS: ${WEBSITE_PREVIEW_TTL_SECONDS:-600}
      WEBSITE_CONTENT_CACHE_TTL_SECONDS: ${WEBSITE_CONTENT_CACHE_TTL_SECONDS:-86400}
    volumes:
      - ./logs/server:/app/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3000/health'').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - petcare-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M

  # 后台管理系统（镜像名规则同 server）
  admin:
    image: ${IMAGE_REGISTRY:-petcare}/admin:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: petcare-admin
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      # 仅绑定本机回环；公网流量统一经 edge-gateway 的 HTTPS 入口访问
      - "127.0.0.1:8986:80"
    volumes:
      - ./logs/nginx:/var/log/nginx
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - petcare-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # 独立官网 SSR；仅在 Docker 内网监听，读取 Nest 已发布内容接口。（镜像名规则同 server）
  website:
    image: ${IMAGE_REGISTRY:-petcare}/website:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.website
    container_name: petcare-website
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      WEBSITE_PUBLIC_URL: ${WEBSITE_PUBLIC_URL:-http://localhost:8080}
      WEBSITE_CONTENT_API_BASE_URL: ${WEBSITE_CONTENT_API_BASE_URL:-http://server:3000}
      WEBSITE_LAST_SUCCESS_TTL_SECONDS: ${WEBSITE_LAST_SUCCESS_TTL_SECONDS:-300}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:4321/healthz'').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - petcare-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # 官网专用公网网关；Admin 静态站点继续使用自己的 Nginx 容器与端口。
  website-gateway:
    image: nginx:alpine
    container_name: petcare-website-gateway
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
      website:
        condition: service_healthy
    ports:
      # 仅绑定本机回环；公网流量统一经 edge-gateway 的 HTTPS 入口访问
      - "127.0.0.1:${WEBSITE_PORT:-8080}:80"
    volumes:
      - ./docker/website-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - petcare-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.15"

  # HTTPS 边缘网关：统一 80/443 入口，双域名 TLS 终结后转发到官网网关与 Admin。
  # 证书挂载自宿主机 ./certs（不入库），文件名约定见 docker/edge-nginx.conf。
  edge-gateway:
    image: nginx:alpine
    container_name: petcare-edge-gateway
    restart: unless-stopped
    depends_on:
      admin:
        condition: service_healthy
      website-gateway:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/edge-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test:
        ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - petcare-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.15"

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  petcare-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
