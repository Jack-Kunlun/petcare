name: 手动生产发布

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要部署的分支、标签或 commit SHA"
        required: true
        default: "master"
      target:
        description: "部署范围"
        required: true
        type: choice
        default: "all"
        options: ["all", "server", "admin", "website"]
      initialize_data:
        description: "仅首次全量部署创建默认数据"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: petcare-production
  cancel-in-progress: false

jobs:
  resolve:
    name: 解析并校验部署提交
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read
      contents: read
    env:
      TCR_REGISTRY: ${{ vars.TCR_REGISTRY }}
      TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      registry: ${{ steps.meta.outputs.registry }}
      registry_host: ${{ steps.meta.outputs.registry_host }}
      services: ${{ steps.meta.outputs.services }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: 解析不可变部署参数
        id: meta
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -Eeuo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TCR_REGISTRY" == "ccr.ccs.tencentyun.com" ]]
          [[ ${#TCR_NAMESPACE} -ge 2 && ${#TCR_NAMESPACE} -le 30 ]]
          [[ "$TCR_NAMESPACE" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]
          case "$TARGET" in
            all) services='["server","admin","website"]' ;;
            server) services='["server"]' ;;
            admin) services='["admin"]' ;;
            website) services='["website"]' ;;
            *) exit 1 ;;
          esac
          {
            echo "sha=$sha"
            echo "image_tag=sha-$sha"
            echo "services=$services"
            echo "registry_host=$TCR_REGISTRY"
            echo "registry=$TCR_REGISTRY/$TCR_NAMESPACE"
          } >> "$GITHUB_OUTPUT"

      - name: 要求该提交的持续集成已成功
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -Eeuo pipefail
          sha="$SHA"
          count="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&status=completed&per_page=50" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          [[ "$count" -gt 0 ]] || {
            echo "所选提交没有成功的持续集成记录" >&2
            exit 1
          }

  build:
    name: 构建并推送 ${{ matrix.service }}
    needs: resolve
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      TCR_PUSH_USERNAME: ${{ secrets.TCR_PUSH_USERNAME }}
      TCR_PUSH_PASSWORD: ${{ secrets.TCR_PUSH_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.resolve.outputs.services) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.resolve.outputs.registry_host }}
          username: ${{ env.TCR_PUSH_USERNAME }}
          password: ${{ env.TCR_PUSH_PASSWORD }}

      - name: 构建并推送 ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ needs.resolve.outputs.registry }}/${{ matrix.service }}:${{ needs.resolve.outputs.image_tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  runtime-images:
    name: 准备运行时镜像 ${{ matrix.repository }}
    needs: resolve
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      TCR_PUSH_USERNAME: ${{ secrets.TCR_PUSH_USERNAME }}
      TCR_PUSH_PASSWORD: ${{ secrets.TCR_PUSH_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: postgres:15-alpine
            repository: postgres
            tag: 15-alpine
          - source: redis:7-alpine
            repository: redis
            tag: 7-alpine
          - source: nginx:alpine
            repository: nginx
            tag: alpine
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.resolve.outputs.registry_host }}
          username: ${{ env.TCR_PUSH_USERNAME }}
          password: ${{ env.TCR_PUSH_PASSWORD }}
      - name: 仅在 TCR 缺少标签时同步
        shell: bash
        env:
          SOURCE_IMAGE: ${{ matrix.source }}
          DESTINATION_IMAGE: ${{ needs.resolve.outputs.registry }}/${{ matrix.repository }}:${{ matrix.tag }}
        run: |
          set -Eeuo pipefail
          probe_error="$(mktemp)"
          trap 'rm -f -- "$probe_error"' EXIT
          if docker manifest inspect "$DESTINATION_IMAGE" > /dev/null 2> "$probe_error"; then
            echo "TCR runtime image already exists; skip overwrite"
          elif grep -Eiq 'manifest unknown|no such manifest|not found' "$probe_error"; then
            docker pull "$SOURCE_IMAGE"
            docker tag "$SOURCE_IMAGE" "$DESTINATION_IMAGE"
            docker push "$DESTINATION_IMAGE"
          else
            sed 's/[^[:print:]]//g' "$probe_error" >&2
            exit 1
          fi

  deploy:
    name: 发布到生产环境
    needs: [resolve, build, runtime-images]
    runs-on: ubuntu-latest
    permissions: {}
    environment: production
    env:
      DEPLOY_TMP: ${{ runner.temp }}/petcare-deploy-${{ github.run_id }}-${{ github.run_attempt }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || 22 }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
      TCR_PULL_USERNAME: ${{ secrets.TCR_PULL_USERNAME }}
      TCR_PULL_PASSWORD: ${{ secrets.TCR_PULL_PASSWORD }}
      TLS_WEBSITE_CERT_B64: ${{ secrets.TLS_WEBSITE_CERT_B64 }}
      TLS_WEBSITE_KEY_B64: ${{ secrets.TLS_WEBSITE_KEY_B64 }}
      TLS_ADMIN_CERT_B64: ${{ secrets.TLS_ADMIN_CERT_B64 }}
      TLS_ADMIN_KEY_B64: ${{ secrets.TLS_ADMIN_KEY_B64 }}
      BACKUP_COS_SECRET_ID: ${{ secrets.BACKUP_COS_SECRET_ID }}
      BACKUP_COS_SECRET_KEY: ${{ secrets.BACKUP_COS_SECRET_KEY }}
      BACKUP_COS_BUCKET: ${{ secrets.BACKUP_COS_BUCKET }}
      BACKUP_COS_REGION: ${{ secrets.BACKUP_COS_REGION }}
      TARGET: ${{ inputs.target }}
      INITIALIZE_DATA: ${{ inputs.initialize_data }}
      TCR_REGISTRY: ${{ needs.resolve.outputs.registry_host }}
      IMAGE_REGISTRY: ${{ needs.resolve.outputs.registry }}
      NEW_IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: 验证并准备临时部署材料
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          for name in \
            DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_HOST_FINGERPRINT TCR_PULL_USERNAME TCR_PULL_PASSWORD \
            TLS_WEBSITE_CERT_B64 TLS_WEBSITE_KEY_B64 TLS_ADMIN_CERT_B64 TLS_ADMIN_KEY_B64 \
            BACKUP_COS_SECRET_ID BACKUP_COS_SECRET_KEY BACKUP_COS_BUCKET BACKUP_COS_REGION
          do
            [[ -n "${!name:-}" ]] || {
              echo "$name is required" >&2
              exit 1
            }
          done
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_HOST_FINGERPRINT" =~ ^SHA256:[a-zA-Z0-9+/]{43}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ && "$DEPLOY_PORT" -ge 1 && "$DEPLOY_PORT" -le 65535 ]] || {
            echo "DEPLOY_PORT must be between 1 and 65535" >&2
            exit 1
          }
          [[ "$TARGET" =~ ^(all|server|admin|website)$ ]]
          [[ "$INITIALIZE_DATA" =~ ^(true|false)$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$NEW_IMAGE_TAG" == "sha-$RELEASE_SHA" ]]
          [[ "$TCR_REGISTRY" == "ccr.ccs.tencentyun.com" ]]
          [[ "$IMAGE_REGISTRY" =~ ^ccr\.ccs\.tencentyun\.com/[a-z0-9]+([._-][a-z0-9]+)*$ ]]
          [[ "$TCR_PULL_USERNAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9-]*$ ]]

          install -d -m 700 "$DEPLOY_TMP"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$DEPLOY_TMP/deploy_key"
          printf '%s' "$TLS_WEBSITE_CERT_B64" | base64 --decode > "$DEPLOY_TMP/petcare-home.com_bundle.crt"
          printf '%s' "$TLS_WEBSITE_KEY_B64" | base64 --decode > "$DEPLOY_TMP/petcare-home.com.key"
          printf '%s' "$TLS_ADMIN_CERT_B64" | base64 --decode > "$DEPLOY_TMP/admin.petcare-home.com_bundle.crt"
          printf '%s' "$TLS_ADMIN_KEY_B64" | base64 --decode > "$DEPLOY_TMP/admin.petcare-home.com.key"
          printf '%s' "$TCR_PULL_PASSWORD" > "$DEPLOY_TMP/tcr-pull.password"
          {
            printf 'BACKUP_COS_SECRET_ID=%s\n' "$BACKUP_COS_SECRET_ID"
            printf 'BACKUP_COS_SECRET_KEY=%s\n' "$BACKUP_COS_SECRET_KEY"
            printf 'BACKUP_COS_BUCKET=%s\n' "$BACKUP_COS_BUCKET"
            printf 'BACKUP_COS_REGION=%s\n' "$BACKUP_COS_REGION"
          } > "$DEPLOY_TMP/petcare-backup.env"
          chmod 600 "$DEPLOY_TMP"/*

          validate_pair() {
            local cert="$1"
            local key="$2"
            local cert_pub=""
            local key_pub=""

            test -s "$cert"
            test -s "$key"
            openssl x509 -in "$cert" -noout -checkend 604800
            cert_pub="$(openssl x509 -in "$cert" -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
            key_pub="$(openssl pkey -in "$key" -pubout -outform DER | sha256sum | cut -d' ' -f1)"
            [[ "$cert_pub" == "$key_pub" ]]
          }

          validate_pair \
            "$DEPLOY_TMP/petcare-home.com_bundle.crt" \
            "$DEPLOY_TMP/petcare-home.com.key"
          validate_pair \
            "$DEPLOY_TMP/admin.petcare-home.com_bundle.crt" \
            "$DEPLOY_TMP/admin.petcare-home.com.key"
          openssl x509 -in "$DEPLOY_TMP/petcare-home.com_bundle.crt" -noout -checkhost petcare-home.com
          openssl x509 -in "$DEPLOY_TMP/petcare-home.com_bundle.crt" -noout -checkhost www.petcare-home.com
          openssl x509 -in "$DEPLOY_TMP/admin.petcare-home.com_bundle.crt" -noout -checkhost admin.petcare-home.com

          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > "$DEPLOY_TMP/scanned_hosts"
          : > "$DEPLOY_TMP/known_hosts"
          while IFS= read -r host_key; do
            fingerprint="$(printf '%s\n' "$host_key" | ssh-keygen -lf - -E sha256 | awk '{print $2}')"
            if [[ "$fingerprint" == "$DEPLOY_HOST_FINGERPRINT" ]]; then
              printf '%s\n' "$host_key" >> "$DEPLOY_TMP/known_hosts"
            fi
          done < "$DEPLOY_TMP/scanned_hosts"
          test -s "$DEPLOY_TMP/known_hosts"
          chmod 600 "$DEPLOY_TMP/known_hosts"

          ssh -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$DEPLOY_TMP/known_hosts" \
            -i "$DEPLOY_TMP/deploy_key" -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" true

      - name: 传输并执行生产发布事务
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE_TMP="/tmp/petcare-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          destination="$DEPLOY_USER@$DEPLOY_HOST"
          remote_ready=false

          cleanup_remote() {
            local status=$?
            if [[ "$remote_ready" == true ]]; then
              ssh -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$DEPLOY_TMP/known_hosts" \
                -i "$DEPLOY_TMP/deploy_key" -p "$DEPLOY_PORT" \
                "$destination" "sudo rm -rf -- '$REMOTE_TMP'" \
                || [[ "$status" -ne 0 ]] || status=1
            fi
            return "$status"
          }
          trap cleanup_remote EXIT

          ssh -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$DEPLOY_TMP/known_hosts" \
            -i "$DEPLOY_TMP/deploy_key" -p "$DEPLOY_PORT" \
            "$destination" "install -d -m 700 '$REMOTE_TMP'"
          remote_ready=true

          scp -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$DEPLOY_TMP/known_hosts" \
            -i "$DEPLOY_TMP/deploy_key" -P "$DEPLOY_PORT" \
            "$DEPLOY_TMP/petcare-home.com_bundle.crt" \
            "$DEPLOY_TMP/petcare-home.com.key" \
            "$DEPLOY_TMP/admin.petcare-home.com_bundle.crt" \
            "$DEPLOY_TMP/admin.petcare-home.com.key" \
            "$DEPLOY_TMP/tcr-pull.password" \
            "$DEPLOY_TMP/petcare-backup.env" \
            "$destination:$REMOTE_TMP/"

          ssh -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$DEPLOY_TMP/known_hosts" \
            -i "$DEPLOY_TMP/deploy_key" -p "$DEPLOY_PORT" \
            "$destination" bash -s -- \
            "$REMOTE_TMP" "$TARGET" "$TCR_REGISTRY" "$IMAGE_REGISTRY" "$RELEASE_SHA" \
            "$NEW_IMAGE_TAG" "$INITIALIZE_DATA" "$TCR_PULL_USERNAME" <<'REMOTE'
          set -Eeuo pipefail
          umask 077

          REMOTE_TMP="$1"
          TARGET="$2"
          TCR_REGISTRY="$3"
          IMAGE_REGISTRY="$4"
          RELEASE_SHA="$5"
          NEW_IMAGE_TAG="$6"
          INITIALIZE_DATA="$7"
          TCR_PULL_USERNAME="$8"
          DOCKER_CONFIG="$REMOTE_TMP/docker-config"

          cleanup() {
            local status=$?
            sudo rm -rf -- "$REMOTE_TMP" || [[ "$status" -ne 0 ]] || status=1
            return "$status"
          }
          trap cleanup EXIT

          [[ "$REMOTE_TMP" =~ ^/tmp/petcare-release-[0-9]+-[0-9]+$ ]]
          [[ "$TARGET" =~ ^(all|server|admin|website)$ ]]
          [[ "$TCR_REGISTRY" == "ccr.ccs.tencentyun.com" ]]
          [[ "$IMAGE_REGISTRY" =~ ^ccr\.ccs\.tencentyun\.com/[a-z0-9]+([._-][a-z0-9]+)*$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$NEW_IMAGE_TAG" == "sha-$RELEASE_SHA" ]]
          [[ "$INITIALIZE_DATA" =~ ^(true|false)$ ]]
          [[ "$TCR_PULL_USERNAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9-]*$ ]]

          sudo install -d -o root -g root -m 700 "$DOCKER_CONFIG"
          sudo env DOCKER_CONFIG="$DOCKER_CONFIG" docker login "$TCR_REGISTRY" \
            -u "$TCR_PULL_USERNAME" --password-stdin < "$REMOTE_TMP/tcr-pull.password"
          sudo rm -f -- "$REMOTE_TMP/tcr-pull.password"

          sudo -H git -C /opt/petcare fetch --prune --tags origin
          sudo -H git -C /opt/petcare cat-file -e "$RELEASE_SHA^{commit}"
          sudo -H git -C /opt/petcare checkout --detach --force "$RELEASE_SHA"
          checked_out="$(sudo -H git -C /opt/petcare rev-parse HEAD)"
          [[ "$checked_out" == "$RELEASE_SHA" ]]

          sudo install -d -o root -g root -m 700 /opt/petcare/certs
          sudo install -o root -g root -m 644 \
            "$REMOTE_TMP/petcare-home.com_bundle.crt" \
            "/opt/petcare/certs/petcare-home.com_bundle.crt.new"
          sudo install -o root -g root -m 600 \
            "$REMOTE_TMP/petcare-home.com.key" \
            "/opt/petcare/certs/petcare-home.com.key.new"
          sudo install -o root -g root -m 644 \
            "$REMOTE_TMP/admin.petcare-home.com_bundle.crt" \
            "/opt/petcare/certs/admin.petcare-home.com_bundle.crt.new"
          sudo install -o root -g root -m 600 \
            "$REMOTE_TMP/admin.petcare-home.com.key" \
            "/opt/petcare/certs/admin.petcare-home.com.key.new"

          validate_pair() {
            local cert="$1"
            local key="$2"
            local cert_pub=""
            local key_pub=""

            sudo test -s "$cert"
            sudo test -s "$key"
            sudo openssl x509 -in "$cert" -noout -checkend 604800
            cert_pub="$(sudo openssl x509 -in "$cert" -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
            key_pub="$(sudo openssl pkey -in "$key" -pubout -outform DER | sha256sum | cut -d' ' -f1)"
            [[ "$cert_pub" == "$key_pub" ]]
          }

          validate_pair "/opt/petcare/certs/petcare-home.com_bundle.crt.new" \
            "/opt/petcare/certs/petcare-home.com.key.new"
          validate_pair "/opt/petcare/certs/admin.petcare-home.com_bundle.crt.new" \
            "/opt/petcare/certs/admin.petcare-home.com.key.new"
          sudo openssl x509 -in "/opt/petcare/certs/petcare-home.com_bundle.crt.new" \
            -noout -checkhost petcare-home.com
          sudo openssl x509 -in "/opt/petcare/certs/petcare-home.com_bundle.crt.new" \
            -noout -checkhost www.petcare-home.com
          sudo openssl x509 -in "/opt/petcare/certs/admin.petcare-home.com_bundle.crt.new" \
            -noout -checkhost admin.petcare-home.com

          sudo mv -f -- "/opt/petcare/certs/petcare-home.com_bundle.crt.new" \
            "/opt/petcare/certs/petcare-home.com_bundle.crt"
          sudo mv -f -- "/opt/petcare/certs/petcare-home.com.key.new" \
            "/opt/petcare/certs/petcare-home.com.key"
          sudo mv -f -- "/opt/petcare/certs/admin.petcare-home.com_bundle.crt.new" \
            "/opt/petcare/certs/admin.petcare-home.com_bundle.crt"
          sudo mv -f -- "/opt/petcare/certs/admin.petcare-home.com.key.new" \
            "/opt/petcare/certs/admin.petcare-home.com.key"
          sudo test -s /opt/petcare/certs/petcare-home.com_bundle.crt
          sudo test -s /opt/petcare/certs/petcare-home.com.key
          sudo test -s /opt/petcare/certs/admin.petcare-home.com_bundle.crt
          sudo test -s /opt/petcare/certs/admin.petcare-home.com.key

          sudo install -o root -g root -m 600 "$REMOTE_TMP/petcare-backup.env" \
            /etc/petcare-backup.env.new
          sudo mv -f -- /etc/petcare-backup.env.new /etc/petcare-backup.env
          sudo chmod 0755 \
            /opt/petcare/scripts/release-production.sh \
            /opt/petcare/scripts/database-backup.sh \
            /opt/petcare/scripts/database-restore.sh
          sudo install -m 0644 \
            /opt/petcare/deploy/systemd/petcare-backup.service \
            /etc/systemd/system/petcare-backup.service
          sudo install -m 0644 \
            /opt/petcare/deploy/systemd/petcare-backup.timer \
            /etc/systemd/system/petcare-backup.timer
          sudo systemctl daemon-reload

          if edge_running="$(sudo docker inspect --format '{{.State.Running}}' petcare-edge-gateway 2>/dev/null)" \
            && [[ "$edge_running" == true ]]
          then
            sudo docker exec petcare-edge-gateway nginx -t
            sudo docker exec petcare-edge-gateway nginx -s reload
          fi

          sudo env \
            DOCKER_CONFIG="$DOCKER_CONFIG" \
            TARGET="$TARGET" \
            IMAGE_REGISTRY="$IMAGE_REGISTRY" \
            RELEASE_SHA="$RELEASE_SHA" \
            NEW_IMAGE_TAG="$NEW_IMAGE_TAG" \
            INITIALIZE_DATA="$INITIALIZE_DATA" \
            bash /opt/petcare/scripts/release-production.sh
          sudo systemctl enable --now petcare-backup.timer
          REMOTE

      - name: 清理 runner 临时凭据
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            local status=$?
            rm -rf -- "$DEPLOY_TMP" || [[ "$status" -ne 0 ]] || status=1
            return "$status"
          }
          trap cleanup EXIT
