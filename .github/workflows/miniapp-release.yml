# 手动触发：构建微信小程序并上传到微信公众平台（体验版/开发版）
# 前置条件：
#   1. 仓库 Secret：MP_UPLOAD_PRIVATE_KEY（微信公众平台生成的上传密钥完整内容）
#   2. 微信后台「开发设置 → IP 白名单」已关闭，或已放行 GitHub Actions 出口 IP
#   3. AppID 与 apps/miniapp/src/manifest.json 保持一致（当前 wx3bdad4ab652f0d1d）
name: 小程序上传

on:
  workflow_dispatch:
    inputs:
      version:
        description: "上传版本号（如 2.0.0）"
        required: true
        default: "2.0.0"
      desc:
        description: "版本备注（会显示在微信后台版本记录）"
        required: false
        default: "GitHub Actions 手动上传"

permissions:
  contents: read

env:
  NODE_VERSION: "24.19.0"
  MP_APPID: wx3bdad4ab652f0d1d

jobs:
  upload:
    name: 构建并上传微信小程序
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 构建小程序（mp-weixin）
        run: pnpm --filter @petcare/miniapp build:mp-weixin

      - name: 写入上传密钥
        run: |
          umask 077
          printf '%s\n' '${{ secrets.MP_UPLOAD_PRIVATE_KEY }}' > private.key

      - name: 上传到微信公众平台
        env:
          MP_VERSION: ${{ inputs.version }}
          MP_DESC: ${{ inputs.desc }}
        run: |
          npx --yes miniprogram-ci@latest upload \
            --pp apps/miniapp/dist/build/mp-weixin \
            --pkp private.key \
            --appid "$MP_APPID" \
            --uv "$MP_VERSION" \
            --desc "$MP_DESC" \
            --enable-es6 true \
            --enable-minify true

      - name: 清理密钥
        if: always()
        run: rm -f private.key
