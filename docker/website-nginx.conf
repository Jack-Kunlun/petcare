map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;

    # Docker service IPs can change when an upstream container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $server_upstream http://server:3000;
    set $website_upstream http://website:4321;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml text/xml application/xml application/xml+rss text/javascript;

    # Preview capabilities never transit the public gateway: Astro SSR calls Nest over the internal network.
    location ^~ /website-content/previews/ {
        return 404;
    }

    # Only published Website Content is publicly routable through this gateway.
    location ^~ /website-content/ {
        proxy_pass $server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    # Classroom articles remain a separate public domain endpoint.
    location = /content/articles {
        proxy_pass $server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location ^~ /content/articles/ {
        proxy_pass $server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    # Development-only local media uses immutable server-generated object keys.
    location ^~ /media/ {
        proxy_pass $server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Versioned Astro bundles may be cached without delaying SSR HTML publication.
    location ^~ /_astro/ {
        proxy_pass $website_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Bundled fallback media is static; COS public media owns its cache policy at its public URL.
    location ^~ /brand/ {
        proxy_pass $website_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Do not cache SSR HTML, so an explicit publish is observable on the next request.
    location / {
        proxy_pass $website_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        add_header Cache-Control "no-store" always;
    }
}
