# PetCare HTTPS 边缘网关
# 统一 80/443 入口：
#   - petcare-home.com / www.petcare-home.com → website-gateway（官网）
#   - admin.petcare-home.com                  → admin（后台管理，admin 内部 Nginx 已反代 /api）
# 证书目录约定（宿主机 /opt/petcare/certs → 容器 /etc/nginx/certs，只读挂载）：
#   - petcare-home.com_bundle.crt / petcare-home.com.key            腾讯云签发（覆盖主域与 www）
#   - admin.petcare-home.com_bundle.crt / admin.petcare-home.com.key 后台子域证书（正式签发前可用自签名证书顶替）

# ---- HTTP：全部重定向到 HTTPS ----
server {
    listen 80;
    server_name petcare-home.com www.petcare-home.com admin.petcare-home.com;

    # Let's Encrypt / 腾讯云证书续期验证可按需在此添加 /.well-known/acme-challenge/ 路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 通用 TLS 参数 ----
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# ---- 官网：petcare-home.com / www ----
server {
    listen 443 ssl;
    http2 on;
    server_name petcare-home.com www.petcare-home.com;

    ssl_certificate /etc/nginx/certs/petcare-home.com_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/petcare-home.com.key;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://website-gateway:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ---- 后台管理：admin.petcare-home.com ----
server {
    listen 443 ssl;
    http2 on;
    server_name admin.petcare-home.com;

    ssl_certificate /etc/nginx/certs/admin.petcare-home.com_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/admin.petcare-home.com.key;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://admin:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
