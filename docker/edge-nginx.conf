# PetCare HTTPS 边缘网关
# 统一 80/443 入口：
#   - petcare-home.com / www.petcare-home.com → website-gateway（官网）
#   - admin.petcare-home.com                  → admin（后台管理，admin 内部 Nginx 已反代 /api）
#   - 其它项目自带的子域                       → 见文件尾部的 extra-confs 扩展点
# 证书目录约定（宿主机 /opt/petcare/certs → 容器 /etc/nginx/certs，只读挂载）：
#   - petcare-home.com_bundle.crt / petcare-home.com.key            腾讯云签发（覆盖主域与 www）
#   - admin.petcare-home.com_bundle.crt / admin.petcare-home.com.key 后台子域证书（正式签发前可用自签名证书顶替）

# ---- HTTP：全部重定向到 HTTPS ----
server {
    listen 80;
    server_name petcare-home.com www.petcare-home.com admin.petcare-home.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 通用 TLS 参数 ----
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# ---- 官网：petcare-home.com / www ----
server {
    listen 443 ssl;
    http2 on;
    server_name petcare-home.com www.petcare-home.com;

    ssl_certificate /etc/nginx/certs/petcare-home.com_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/petcare-home.com.key;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://website-gateway:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ---- 后台管理：admin.petcare-home.com ----
server {
    listen 443 ssl;
    http2 on;
    server_name admin.petcare-home.com;

    ssl_certificate /etc/nginx/certs/admin.petcare-home.com_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/admin.petcare-home.com.key;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 11m;

    location / {
        proxy_pass http://admin:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ---- 外部子站点扩展点 ----
# 允许**其它项目**在 releases 树之外维护自己的 server 块（含各自的 80 块）：
#   宿主 /opt/petcare/extra-confs/ → 容器 /etc/nginx/extra-confs/（只读挂载，见 docker-compose.yml）
#
# 为什么要有它：别的项目如果把配置「追加」进本文件，本项目每次发版都会把它冲掉
# （本文件属于 release 产物，切 release 即整体替换）。留一个 include 就等于把
# 「这一行由本仓库负责长期保留」和「子站配置本体归各自项目」分开，
# 于是本项目发版不再影响那些子站，它们改配置也不必等本项目发版。
#
# 通配 include 匹配不到文件时 nginx **不报错**（只有非通配路径缺失才会），
# 所以这个目录为空、或某个子站临时下线都安全。
include /etc/nginx/extra-confs/*.conf;
