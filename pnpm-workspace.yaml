packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": true
  "@scarf/scarf": false
  "@swc/core": true
  "@tarojs/binding": true
  "@tarojs/cli": true
  argon2: true
  core-js-pure: false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@weapp-tailwindcss/postcss@3.2.4"
  - weapp-tailwindcss@5.2.4
